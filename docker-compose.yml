services:
  cockpit:
    build: .
    image: devops-cockpit:latest
    container_name: devops-cockpit
    ports:
      - "${COCKPIT_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - TZ=${TZ:-UTC}
    volumes:
      # :z relabels the directory for SELinux hosts (RHEL/Rocky/Fedora); ignored elsewhere.
      - ./data:/app/data:z
      # Gives the cockpit control of the host's Docker/Swarm daemon.
      # Omit this mount if you don't want the container managing the host.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
