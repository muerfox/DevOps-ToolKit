{% extends "base.html" %}
{% block page_title %}Server · {{ record.name }}{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>#terminal-container .xterm { height: 100%; }</style>
{% endblock %}
{% block content %}
<div class="pill-row"><a class="btn small" href="/ssh">&larr; Back to servers</a></div>
<div id="terminal-container"></div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script>
  const term = new Terminal({ theme: { background: '#000000' }, fontSize: 14, cursorBlink: true });
  term.open(document.getElementById('terminal-container'));
  term.writeln('Connecting to {{ record.name }} ({{ record.host }})...');

  const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${window.location.host}/ws/ssh/{{ record.name }}/shell`);

  ws.onopen = () => term.writeln('Connected.\r\n');
  ws.onmessage = (evt) => term.write(evt.data);
  ws.onclose = () => term.writeln('\r\n[disconnected]');
  ws.onerror = () => term.writeln('\r\n[connection error]');

  term.onData((data) => {
    if (ws.readyState === WebSocket.OPEN) ws.send(data);
  });
</script>
{% endblock %}
