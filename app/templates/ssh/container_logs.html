{% extends "base.html" %}
{% block page_title %}{{ record.name }} · Container {{ container_id }}{% endblock %}
{% block content %}
<div class="pill-row"><a class="btn small" href="/ssh/servers/{{ record.name }}">&larr; Back to {{ record.name }}</a></div>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<div class="card">
  <h3>Logs (tail)</h3>
  <pre class="log">{{ logs or '' }}</pre>
</div>
{% endblock %}
