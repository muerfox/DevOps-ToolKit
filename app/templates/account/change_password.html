{% extends "base.html" %}
{% block page_title %}My Account{% endblock %}
{% block content %}
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
{% if saved %}<div class="alert info">Password changed.</div>{% endif %}

<div class="card" style="max-width:420px">
  <h3>Change password</h3>
  <form method="post" action="/account/change-password">
    <div class="field"><label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" required></div>
    <div class="field"><label for="new_password">New password</label><input id="new_password" name="new_password" type="password" required></div>
    <div class="field"><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" required></div>
    <button class="btn primary" type="submit">Change password</button>
  </form>
</div>
{% endblock %}
